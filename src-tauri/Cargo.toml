[package]
name = "hushio-desktop"
version = "1.1.1"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

[lib]
name = "hushio_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-store = "2"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tokio = { version = "1.54.1", features = ["full"] }
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip", "cookies"] }
regex = "1.13.1"
scraper = "0.20"
unicode-normalization = "0.1.26"
lofty = "0.22"
tokio-util = "0.7.20"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
