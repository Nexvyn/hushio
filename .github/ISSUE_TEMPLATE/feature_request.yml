name: Feature request
description: Suggest something Hushio should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you want to do
      description: Describe what you are trying to do and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How it could work
      description: Describe the feature as you picture it. Sketches and screenshots from other apps help.
  - type: dropdown
    id: platform
    attributes:
      label: Where you would use it
      multiple: true
      options:
        - Desktop
        - Android
  - type: textarea
    id: alternatives
    attributes:
      label: What you use instead today
