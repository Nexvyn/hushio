name: release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (empty = current ref)"
        required: false
        default: ""
      only:
        description: "Platforms to build"
        type: choice
        options: [all, linux-android]
        default: all
  push:
    tags: ["v*"]
permissions:
  contents: write
env:
  PNPM_VERSION: 10.34.5
  LINUX_DEPS: build-essential curl wget file libxdo-dev libssl-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libsecret-1-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav xvfb dbus-x11 gnome-keyring libasound2-dev
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "22"
          cache: pnpm
      - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
      - uses: swatinem/rust-cache@v2.9.3
        with:
          workspaces: src-tauri
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml
  build:
    if: inputs.only != 'linux-android'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "22"
          cache: pnpm
      - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
      - uses: swatinem/rust-cache@v2.9.3
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "Hushio ${{ inputs.tag || github.ref_name }}"
          releaseDraft: false
          includeUpdaterJson: true
      - name: Rename Windows release files and update latest.json
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          NSIS=src-tauri/target/release/bundle/nsis
          WORK="$RUNNER_TEMP/rename"
          mkdir -p "$WORK"
          gh release download "$TAG" --pattern latest.json --dir "$WORK" --clobber
          for old in "$NSIS"/Hushio_"$VERSION"_x64-setup.exe "$NSIS"/Hushio_"$VERSION"_x64-setup.exe.sig; do
            name=$(basename "$old")
            new=${name/Hushio_${VERSION}_/Hushio-${VERSION}-}
            cp "$old" "$WORK/$new"
            gh release upload "$TAG" "$WORK/$new" --clobber
            gh release delete-asset "$TAG" "$name" --yes
            sed -i "s|/${name}\"|/${new}\"|" "$WORK/latest.json"
          done
          gh release upload "$TAG" "$WORK/latest.json" --clobber
  build-macos:
    needs: build
    if: inputs.only != 'linux-android'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
            platform: darwin-aarch64
          - arch: x64
            target: x86_64-apple-darwin
            platform: darwin-x86_64
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "22"
          cache: pnpm
      - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          target: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2.9.3
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Select macOS signing mode
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi
          {
            echo "HUSHIO_DEVELOPER_ID=1"
            echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            echo "APPLE_ID=$APPLE_ID"
            echo "APPLE_PASSWORD=$APPLE_PASSWORD"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
          } >> "$GITHUB_ENV"
      - name: Turn off Spotlight
        run: sudo mdutil -a -i off
      - uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "Hushio ${{ inputs.tag || github.ref_name }}"
          releaseDraft: false
          includeUpdaterJson: true
          args: --target ${{ matrix.target }} --bundles app
      - name: Rename macOS archive and update latest.json
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
          ARCH: ${{ matrix.arch }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          BUNDLE="src-tauri/target/${{ matrix.target }}/release/bundle"
          ARCHIVE=$(ls "$BUNDLE"/macos/*.app.tar.gz)
          ORIG=$(basename "$ARCHIVE")
          NAME="Hushio-${VERSION}-${ARCH}.app.tar.gz"
          WORK="$RUNNER_TEMP/rename"
          mkdir -p "$WORK"
          cp "$ARCHIVE" "$WORK/$NAME"
          cp "$ARCHIVE.sig" "$WORK/$NAME.sig"
          gh release download "$TAG" --pattern latest.json --dir "$WORK" --clobber
          gh release upload "$TAG" "$WORK/$NAME" "$WORK/$NAME.sig" --clobber
          case "$ARCH" in arm64) UPLOADED=aarch64 ;; *) UPLOADED=x64 ;; esac
          for old in "Hushio_${UPLOADED}.app.tar.gz" "Hushio_${UPLOADED}.app.tar.gz.sig" "$ORIG" "$ORIG.sig"; do
            if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qxF "$old"; then
              gh release delete-asset "$TAG" "$old" --yes
            fi
          done
          node -e '
            const fs = require("node:fs");
            const [file, key, url, sig] = process.argv.slice(1);
            const manifest = JSON.parse(fs.readFileSync(file, "utf8"));
            const entry = { signature: fs.readFileSync(sig, "utf8").trim(), url };
            manifest.platforms = { ...(manifest.platforms ?? {}), [key]: entry, [`${key}-app`]: entry };
            fs.writeFileSync(file, JSON.stringify(manifest, null, 2) + "\n");
          ' "$WORK/latest.json" "$PLATFORM" "https://github.com/$GH_REPO/releases/download/$TAG/$NAME" "$WORK/$NAME.sig"
          gh release upload "$TAG" "$WORK/latest.json" --clobber
      - name: Build DMG (best effort)
        shell: bash
        run: pnpm tauri build --target ${{ matrix.target }} --bundles dmg || true
      - name: Publish DMG (best effort)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          VERSION="${TAG#v}"
          DMG=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/dmg" -name "*.dmg" 2>/dev/null | head -n1)
          if [ -z "$DMG" ]; then
            echo "::warning::No DMG was produced for $ARCH"
            exit 0
          fi
          NAME="Hushio-${VERSION}-${ARCH}.dmg"
          cp "$DMG" "$RUNNER_TEMP/$NAME"
          gh release upload "$TAG" "$RUNNER_TEMP/$NAME" --clobber || echo "::warning::DMG upload failed for $ARCH"
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: mac-bundles-${{ matrix.arch }}
          path: src-tauri/target/**/bundle/**
  verify-macos:
    needs: build-macos
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    env:
      EXPECT_DEVELOPER_ID: "${{ secrets.APPLE_CERTIFICATE != '' && '1' || '' }}"
    steps:
      - uses: actions/download-artifact@v4.1.8
        with:
          name: mac-bundles-${{ matrix.arch }}
          path: mac-bundles
      - name: Verify DMG, archive, signature and minimum macOS version
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/verify-${{ matrix.arch }}"
          mkdir -p "$WORK"
          check_app() {
            local app="$1"
            codesign --verify --deep --strict --verbose=2 "$app"
            local info
            info=$(codesign -dv "$app" 2>&1)
            sed -n '1,5p' <<< "$info"
            if [ -n "$EXPECT_DEVELOPER_ID" ]; then
              grep -q "Authority=Developer ID Application" <<< "$info" || { echo "::error::Developer ID signature expected"; exit 1; }
              spctl --assess --type execute -vv "$app" || { echo "::error::Gatekeeper rejected the Developer ID build"; exit 1; }
            else
              grep -q "Signature=adhoc" <<< "$info" || { echo "::error::ad-hoc signature expected"; exit 1; }
              spctl --assess --type execute -vv "$app" || echo "::warning::spctl rejected (expected while ad-hoc signed)"
            fi
          }
          DMG=$(find mac-bundles -name "*.dmg" | head -n1)
          if [ -z "$DMG" ]; then
            echo "::error::No DMG in mac-bundles-${{ matrix.arch }}"
            exit 1
          fi
          MNT="$WORK/mount"
          mkdir -p "$MNT"
          hdiutil attach -nobrowse -readonly -mountpoint "$MNT" "$DMG"
          trap 'hdiutil detach "$MNT" -quiet || true' EXIT
          APP="$MNT/Hushio.app"
          if [ ! -d "$APP" ]; then
            echo "::error::Hushio.app is missing from the DMG"
            exit 1
          fi
          check_app "$APP"
          BIN=$(find "$APP/Contents/MacOS" -maxdepth 1 -type f | head -n1)
          MINOS=$(vtool -show-build "$BIN" | awk '/minos/ {print $2; exit}')
          DECL=$(/usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" "$APP/Contents/Info.plist")
          echo "declared=$DECL binary minos=$MINOS"
          if [ "$DECL" != "$MINOS" ] && [ "$(printf '%s\n%s\n' "$DECL" "$MINOS" | sort -V | head -n1)" = "$DECL" ]; then
            echo "::error::declared minimum $DECL is lower than the binary minos $MINOS"
            exit 1
          fi
          "$BIN" > "$WORK/launch.log" 2>&1 &
          PID=$!
          sleep 10
          if ! kill -0 "$PID" 2>/dev/null; then
            cat "$WORK/launch.log"
            echo "::error::Hushio exited within 10 seconds of launch"
            exit 1
          fi
          kill "$PID" || true
          ARCHIVE=$(find mac-bundles -name "*.app.tar.gz" | head -n1)
          if [ -z "$ARCHIVE" ]; then
            echo "::error::No updater archive in mac-bundles-${{ matrix.arch }}"
            exit 1
          fi
          mkdir -p "$WORK/archive"
          tar -xzf "$ARCHIVE" -C "$WORK/archive"
          check_app "$WORK/archive/Hushio.app"
  linux:
    needs: [build, build-macos]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-22.04
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "22"
          cache: pnpm
      - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
      - uses: swatinem/rust-cache@v2.9.3
        with:
          workspaces: src-tauri
      - name: Install Linux build dependencies
        timeout-minutes: 15
        run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y $LINUX_DEPS
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "Hushio ${{ inputs.tag || github.ref_name }}"
          releaseDraft: false
          includeUpdaterJson: false
          args: --bundles deb,rpm --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Verify Linux bundles
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE=src-tauri/target/release/bundle
          dpkg-deb --info "$BUNDLE"/deb/*.deb | grep -E 'Depends|Package'
          sudo apt-get install -y rpm
          rpm -qpR "$BUNDLE"/rpm/*.rpm | grep -E 'webkit2gtk4.1|gstreamer1-libav'
          sha256sum "$BUNDLE"/deb/*.deb "$BUNDLE"/rpm/*.rpm
      - name: Rename Linux release files and update latest.json
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          BUNDLE=src-tauri/target/release/bundle
          WORK="$RUNNER_TEMP/rename"
          mkdir -p "$WORK"
          new_name() {
            case "$1" in
              *.deb) echo "Hushio-${VERSION}-linux-amd64.deb" ;;
              *.rpm) echo "Hushio-${VERSION}-linux-x86_64.rpm" ;;
            esac
          }
          gh release download "$TAG" --pattern latest.json --dir "$WORK" --clobber
          for old in "$BUNDLE"/deb/*.deb "$BUNDLE"/rpm/*.rpm; do
            name=$(basename "$old")
            new=$(new_name "$name")
            cp "$old" "$WORK/$new"
            gh release upload "$TAG" "$WORK/$new" --clobber
            gh release delete-asset "$TAG" "$name" --yes
            sed -i "s|/${name}\"|/${new}\"|" "$WORK/latest.json"
          done
          gh release upload "$TAG" "$WORK/latest.json" --clobber
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: linux-bundles
          path: src-tauri/target/release/bundle/**
  android:
    needs: [build, linux]
    if: ${{ !failure() && !cancelled() && startsWith(inputs.tag || github.ref_name, 'v') }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      ANDROID_NDK_VERSION: 27.0.12077973
      APK_DIR: dist-apk
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "22"
          cache: pnpm
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3.2.2
      - name: Install the pinned NDK
        run: sdkmanager "ndk;${ANDROID_NDK_VERSION}"
      - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          target: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: swatinem/rust-cache@v2.9.3
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Decode the release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hushio-release.jks"
      - name: Build the APKs
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/hushio-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          HUSHIO_GOOGLE_CLIENT_ID: ${{ secrets.HUSHIO_GOOGLE_CLIENT_ID }}
          HUSHIO_SPOTIFY_CLIENT_ID: ${{ secrets.HUSHIO_SPOTIFY_CLIENT_ID }}
        run: |
          set -euo pipefail
          pnpm tauri android build --apk --split-per-abi --target aarch64 armv7 x86_64
          pnpm tauri android build --apk --target aarch64 armv7 x86_64
      - name: Name the APKs, verify the signature and write SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          BUILD=src-tauri/gen/android/app/build/outputs/apk
          mkdir -p "$APK_DIR"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "$BUILD/$abi/release/app-$abi-release.apk" "$APK_DIR/hushio-$VERSION-$abi.apk"
          done
          cp "$BUILD/universal/release/app-universal-release.apk" "$APK_DIR/hushio-$VERSION-universal.apk"
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)/apksigner
          for apk in "$APK_DIR"/hushio-*.apk; do
            "$APKSIGNER" verify --verbose "$apk"
          done
          cd "$APK_DIR"
          sha256sum hushio-*.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Upload the files to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release view "$TAG" > /dev/null
          gh release upload "$TAG" "$APK_DIR"/* --clobber
      - name: Delete the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/hushio-release.jks"
