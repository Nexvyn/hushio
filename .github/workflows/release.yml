name: release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.0.1"
        required: true
        type: string
      publish:
        description: "Publish when every job passes (off = keep it as a draft)"
        type: boolean
        default: true
  push:
    tags: ["v*"]
permissions:
  contents: write
concurrency:
  group: "release-${{ inputs.tag || github.ref_name }}"
  cancel-in-progress: true
env:
  PNPM_VERSION: 10.34.5
  LINUX_DEPS: build-essential curl wget file libxdo-dev libssl-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libsecret-1-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav xvfb dbus-x11 gnome-keyring libasound2-dev
  TAG: ${{ inputs.tag || github.ref_name }}
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4.4.0
      - name: Check the version, secrets and release
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          CONF=$(node -p "require('./src-tauri/tauri.conf.json').version")
          CARGO=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n1)
          if [ "$VERSION" != "$CONF" ] || [ "$VERSION" != "$CARGO" ]; then
            echo "::error::Versions differ: package.json $VERSION, tauri.conf.json $CONF, Cargo.toml $CARGO"
            exit 1
          fi
          if [ "$PUBLISH" = "true" ] && [ "$TAG" != "v$VERSION" ]; then
            echo "::error::The tag $TAG does not match the app version $VERSION. Bump the version first."
            exit 1
          fi
          MISSING=()
          for name in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              MISSING+=("$name")
            fi
          done
          if [ "${#MISSING[@]}" -gt 0 ]; then
            echo "::error::Missing secrets: ${MISSING[*]}"
            exit 1
          fi
          if DRAFT=$(gh release view "$TAG" --json isDraft --jq .isDraft); then
            if [ "$DRAFT" = "false" ]; then
              echo "::error::$TAG is already published."
              exit 1
            fi
          else
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "Hushio $TAG" --generate-notes
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
  tests:
    uses: ./.github/workflows/ci.yml
  windows:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: pnpm/action-setup@v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "22"
          cache: pnpm
      - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          cache: false
          rustflags: ""
      - uses: swatinem/rust-cache@v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
          workspaces: src-tauri
          shared-key: release-windows
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - name: Prepare the pinned mpv runtime
        shell: bash
        run: bash scripts/prepare-mpv-runtime.sh windows x64
      - name: Build the installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles nsis
      - name: Upload the installer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          NSIS=src-tauri/target/release/bundle/nsis
          OUT="$RUNNER_TEMP/out"
          mkdir -p "$OUT"
          cp "$NSIS/Hushio_${VERSION}_x64-setup.exe" "$OUT/Hushio-${VERSION}-x64-setup.exe"
          cp "$NSIS/Hushio_${VERSION}_x64-setup.exe.sig" "$OUT/Hushio-${VERSION}-x64-setup.exe.sig"
          gh release upload "$TAG" "$OUT"/* --clobber
  macos:
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: x64
            target: x86_64-apple-darwin
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: pnpm/action-setup@v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "22"
          cache: pnpm
      - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          target: ${{ matrix.target }}
          cache: false
          rustflags: ""
      - uses: swatinem/rust-cache@v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
          workspaces: src-tauri
          shared-key: release-macos-${{ matrix.arch }}
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - name: Prepare the pinned mpv runtime
        shell: bash
        run: bash scripts/prepare-mpv-runtime.sh macos ${{ matrix.arch }}
      - name: Select macOS signing mode
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi
          {
            echo "HUSHIO_DEVELOPER_ID=1"
            echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            echo "APPLE_ID=$APPLE_ID"
            echo "APPLE_PASSWORD=$APPLE_PASSWORD"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
          } >> "$GITHUB_ENV"
      - name: Turn off Spotlight
        run: sudo mdutil -a -i off
      - name: Build the app
        run: pnpm tauri build --target ${{ matrix.target }} --bundles app
      - name: Build the DMG
        shell: bash
        run: |
          for attempt in 1 2 3; do
            pnpm tauri bundle --target ${{ matrix.target }} --bundles dmg && exit 0
            echo "::warning::DMG attempt $attempt failed"
            sleep 15
          done
          exit 1
      - name: Upload the app archive and DMG
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          BUNDLE="src-tauri/target/${{ matrix.target }}/release/bundle"
          ARCHIVE=$(ls "$BUNDLE"/macos/*.app.tar.gz)
          DMG=$(ls "$BUNDLE"/dmg/*.dmg | head -n1)
          OUT="$RUNNER_TEMP/out"
          mkdir -p "$OUT"
          cp "$ARCHIVE" "$OUT/Hushio-${VERSION}-${ARCH}.app.tar.gz"
          cp "$ARCHIVE.sig" "$OUT/Hushio-${VERSION}-${ARCH}.app.tar.gz.sig"
          cp "$DMG" "$OUT/Hushio-${VERSION}-${ARCH}.dmg"
          gh release upload "$TAG" "$OUT"/* --clobber
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: mac-bundles-${{ matrix.arch }}
          path: src-tauri/target/**/bundle/**
  verify-macos:
    needs: macos
    runs-on: macos-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    env:
      EXPECT_DEVELOPER_ID: "${{ secrets.APPLE_CERTIFICATE != '' && '1' || '' }}"
    steps:
      - uses: actions/download-artifact@v4.1.8
        with:
          name: mac-bundles-${{ matrix.arch }}
          path: mac-bundles
      - name: Verify DMG, archive, signature and minimum macOS version
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/verify-${{ matrix.arch }}"
          mkdir -p "$WORK"
          check_app() {
            local app="$1"
            codesign --verify --deep --strict --verbose=2 "$app"
            local info
            info=$(codesign -dv "$app" 2>&1)
            sed -n '1,5p' <<< "$info"
            if [ -n "$EXPECT_DEVELOPER_ID" ]; then
              grep -q "Authority=Developer ID Application" <<< "$info" || { echo "::error::Developer ID signature expected"; exit 1; }
              spctl --assess --type execute -vv "$app" || { echo "::error::Gatekeeper rejected the Developer ID build"; exit 1; }
            else
              grep -q "Signature=adhoc" <<< "$info" || { echo "::error::ad-hoc signature expected"; exit 1; }
              spctl --assess --type execute -vv "$app" || echo "::warning::spctl rejected (expected while ad-hoc signed)"
            fi
          }
          DMG=$(find mac-bundles -name "*.dmg" | head -n1)
          if [ -z "$DMG" ]; then
            echo "::error::No DMG in mac-bundles-${{ matrix.arch }}"
            exit 1
          fi
          MNT="$WORK/mount"
          mkdir -p "$MNT"
          hdiutil attach -nobrowse -readonly -mountpoint "$MNT" "$DMG"
          trap 'hdiutil detach "$MNT" -quiet || true' EXIT
          APP="$MNT/Hushio.app"
          if [ ! -d "$APP" ]; then
            echo "::error::Hushio.app is missing from the DMG"
            exit 1
          fi
          check_app "$APP"
          BIN=$(find "$APP/Contents/MacOS" -maxdepth 1 -type f | head -n1)
          MINOS=$(vtool -show-build "$BIN" | awk '/minos/ {print $2; exit}')
          DECL=$(/usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" "$APP/Contents/Info.plist")
          echo "declared=$DECL binary minos=$MINOS"
          if [ "$DECL" != "$MINOS" ] && [ "$(printf '%s\n%s\n' "$DECL" "$MINOS" | sort -V | head -n1)" = "$DECL" ]; then
            echo "::error::declared minimum $DECL is lower than the binary minos $MINOS"
            exit 1
          fi
          "$BIN" > "$WORK/launch.log" 2>&1 &
          PID=$!
          sleep 10
          if ! kill -0 "$PID" 2>/dev/null; then
            cat "$WORK/launch.log"
            echo "::error::Hushio exited within 10 seconds of launch"
            exit 1
          fi
          kill "$PID" || true
          ARCHIVE=$(find mac-bundles -name "*.app.tar.gz" | head -n1)
          if [ -z "$ARCHIVE" ]; then
            echo "::error::No updater archive in mac-bundles-${{ matrix.arch }}"
            exit 1
          fi
          mkdir -p "$WORK/archive"
          tar -xzf "$ARCHIVE" -C "$WORK/archive"
          check_app "$WORK/archive/Hushio.app"
  linux:
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: pnpm/action-setup@v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "22"
          cache: pnpm
      - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          cache: false
          rustflags: ""
      - uses: swatinem/rust-cache@v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
          workspaces: src-tauri
          shared-key: release-linux
          cache-on-failure: true
      - name: Install Linux build dependencies
        timeout-minutes: 15
        run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y $LINUX_DEPS
      - run: pnpm install --frozen-lockfile
      - name: Build the deb and rpm
        run: pnpm tauri build --bundles deb,rpm --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Verify Linux bundles
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE=src-tauri/target/release/bundle
          dpkg-deb --info "$BUNDLE"/deb/*.deb | grep -E 'Depends|Package'
          sudo apt-get install -y rpm
          rpm -qpR "$BUNDLE"/rpm/*.rpm | grep -E 'webkit2gtk4.1|gstreamer1-libav'
          sha256sum "$BUNDLE"/deb/*.deb "$BUNDLE"/rpm/*.rpm
      - name: Upload the deb and rpm
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          BUNDLE=src-tauri/target/release/bundle
          OUT="$RUNNER_TEMP/out"
          mkdir -p "$OUT"
          DEB=$(ls "$BUNDLE"/deb/*.deb | head -n1)
          RPM=$(ls "$BUNDLE"/rpm/*.rpm | head -n1)
          cp "$DEB" "$OUT/Hushio-${VERSION}-linux-amd64.deb"
          cp "$RPM" "$OUT/Hushio-${VERSION}-linux-x86_64.rpm"
          gh release upload "$TAG" "$OUT"/* --clobber
  android:
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      ANDROID_NDK_VERSION: 27.0.12077973
      APK_DIR: dist-apk
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: pnpm/action-setup@v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "22"
          cache: pnpm
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Install the pinned NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "ndk;${ANDROID_NDK_VERSION}"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
      - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          target: aarch64-linux-android,armv7-linux-androideabi
          cache: false
          rustflags: ""
      - uses: swatinem/rust-cache@v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
          workspaces: src-tauri
          shared-key: release-android
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - name: Decode the release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hushio-release.jks"
      - name: Build the APKs
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/hushio-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          HUSHIO_GOOGLE_CLIENT_ID: ${{ secrets.HUSHIO_GOOGLE_CLIENT_ID }}
          HUSHIO_SPOTIFY_CLIENT_ID: ${{ secrets.HUSHIO_SPOTIFY_CLIENT_ID }}
        run: |
          set -euo pipefail
          pnpm build:web
          NO_WEB='{"build":{"beforeBuildCommand":null}}'
          pnpm tauri android build --apk --split-per-abi --target aarch64 armv7 --config "$NO_WEB"
          pnpm tauri android build --apk --target aarch64 armv7 --config "$NO_WEB"
      - name: Name and verify the APKs
        shell: bash
        run: |
          set -euo pipefail
          BUILD=src-tauri/gen/android/app/build/outputs/apk
          mkdir -p "$APK_DIR"
          for pair in arm64:arm64-v8a arm:armeabi-v7a; do
            flavor=${pair%%:*}
            abi=${pair#*:}
            cp "$BUILD/$flavor/release/app-$flavor-release.apk" "$APK_DIR/hushio-$VERSION-$abi.apk"
          done
          cp "$BUILD/universal/release/app-universal-release.apk" "$APK_DIR/hushio-$VERSION-universal.apk"
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)/apksigner
          for apk in "$APK_DIR"/hushio-*.apk; do
            "$APKSIGNER" verify --verbose "$apk"
          done
      - name: Upload the APKs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$TAG" "$APK_DIR"/*.apk --clobber
      - name: Delete the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/hushio-release.jks"
  publish:
    needs: [prepare, tests, windows, macos, verify-macos, linux, android]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Write latest.json and SHA256SUMS.txt
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/assets"
          mkdir -p "$WORK"
          cd "$WORK"
          gh release download "$TAG" --pattern "Hushio-*" --pattern "hushio-*" --clobber
          sha256sum $(ls | grep -v '\.sig$') > SHA256SUMS.txt
          cat SHA256SUMS.txt
          node -e '
            const fs = require("node:fs");
            const [version, base] = process.argv.slice(1);
            const entry = (file) => ({ signature: fs.readFileSync(file + ".sig", "utf8").trim(), url: base + file });
            const win = entry(`Hushio-${version}-x64-setup.exe`);
            const arm = entry(`Hushio-${version}-arm64.app.tar.gz`);
            const x64 = entry(`Hushio-${version}-x64.app.tar.gz`);
            fs.writeFileSync("latest.json", JSON.stringify({ version, notes: "", pub_date: new Date().toISOString(), platforms: { "windows-x86_64": win, "windows-x86_64-nsis": win, "darwin-aarch64": arm, "darwin-aarch64-app": arm, "darwin-x86_64": x64, "darwin-x86_64-app": x64 } }, null, 2) + "\n");
          ' "$VERSION" "https://github.com/$GH_REPO/releases/download/$TAG/"
          gh release upload "$TAG" SHA256SUMS.txt latest.json --clobber
      - name: Publish the release
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$TAG" --draft=false --latest
