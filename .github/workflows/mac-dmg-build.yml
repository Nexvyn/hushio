name: mac-dmg-build
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  PNPM_VERSION: 10.34.5
  LINUX_DEPS: build-essential curl wget file libxdo-dev libssl-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libsecret-1-dev libasound2-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav xvfb dbus-x11 gnome-keyring
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
        include:
          - os: windows-latest
            bundles: ""
          - os: ubuntu-22.04
            bundles: "--bundles deb,rpm"
          - os: macos-latest
            bundles: "--bundles dmg"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: pnpm/action-setup@v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "22"
          cache: pnpm
      - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
      - uses: swatinem/rust-cache@v2.9.3
        with:
          workspaces: src-tauri
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - run: pnpm install --frozen-lockfile
      - shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "1"
        run: pnpm tauri build ${{ matrix.bundles }} --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: hushio-${{ matrix.os }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
